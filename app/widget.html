<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAT Deregistration</title>
    <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div class="form-container">
        <button class="close-button" onclick="closeWidget()">×</button>
        <form id="record-form" novalidate>
            <label for="reference-number">Reference Number <span style="color: red;">*</span></label>
            <input type="text" id="reference-number" placeholder="Enter Reference Number"/>
            <span class="error-message" id="error-reference-number"></span>

            <label for="name-of-taxable-person">Legal Name of Taxable Person <span style="color: red;">*</span></label>
            <input type="text" id="name-of-taxable-person" placeholder="Enter Legal Name"/>
            <span class="error-message" id="error-name-of-taxable-person"></span>

            <label for="tax-registration-number">Tax Registration Number (TRN) <span style="color: red;">*</span></label>
            <input type="text" id="tax-registration-number" placeholder="Enter TRN"/>
            <span class="error-message" id="error-tax-registration-number"></span>

            <label for="application-date">Application Date <span style="color: red;">*</span></label>
            <input type="date" id="application-date" required />
            <span class="error-message" id="error-application-date"></span>

            <label>FTA Notice of Submission <span style="color: red;">*</span></label>
            <div id="drop-zone">
                <span id="file-label-text">Click or drag & drop PDF/Image</span>
                <input type="file" id="fta-notive-of-submission" class="hidden" accept=".pdf,.jpg,.jpeg,.png">
            </div>
            <span class="error-message" id="error-fta-notive-of-submission"></span>

            <button class="submit-button" type="submit" id="submit_button_id">Submit</button>
        </form>
    </div>

    <div id="upload-buffer" class="upload-overlay hidden">
        <div class="upload-box">
            <div class="upload-icon">⬆️</div>
            <div class="upload-title">Uploading your file...</div>
            <div class="progress-bar-background">
                <div id="upload-progress" class="progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <!-- Toast notification (replaces the old blocking modal) -->
    <div id="toast" class="hidden">
        <div id="toast-icon-success" class="hidden toast-icon">✅</div>
        <div id="toast-icon-error" class="hidden toast-icon">❌</div>
        <div class="toast-content">
            <p id="toast-title"></p>
            <p id="toast-message"></p>
        </div>
        <div class="toast-progress-track">
            <div id="toast-progress-bar"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
